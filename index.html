<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Code Editor WAP</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e1e">

  <!-- CodeMirror Base Style -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e1e1e;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #007bff;
    }
    .btn-install {
      display: none;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .editor-container {
      flex: 1;
      height: calc(100vh - 49px);
    }
    .CodeMirror {
      height: 100% !important;
      font-family: 'Fira Code', Consolas, Monaco, 'Andale Mono', monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>WAP JS Editor</h1>
    <button id="installBtn" class="btn-install">Install App</button>
  </header>

  <div class="editor-container">
    <textarea id="code-editor">// Masukkan atau edit kode JavaScript kamu di sini
function greeting(name) {
    console.log("Halo " + name + ", selamat datang di WAP Editor!");
}

greeting("User");
</textarea>
  </div>

  <!-- Library Utama CodeMirror -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  
  <!-- File Mode JS Milik Kamu -->
  <script src="javascript.min.js"></script>

  <script>
    // Inisialisasi Editor Kode
    var editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
      lineNumbers: true,
      mode: "javascript",
      theme: "dracula",
      tabSize: 2,
      lineWrapping: true
    });

    // Fitur Registrasi PWA (Add to Home Screen)
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Berhasil Didaftarkan'))
          .catch(err => console.error('Gagal Mendaftarkan Service Worker:', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', () => {
      installBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User menerima installasi WAP');
          }
          deferredPrompt = null;
        });
      }
    });
  </script>
</body>
</html>
